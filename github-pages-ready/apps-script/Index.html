<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素養導向測驗生成器</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- === 檔案解析函式庫 === -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      body { font-family: 'Noto Sans TC', sans-serif; }
      .result-area {
        font-family: 'Noto Sans Mono', 'Consolas', 'Monaco', monospace;
      }
      .loading-overlay {
        background-color: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(2px);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef } = React;

      // Icons
      const IconBook = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;
      const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
      const IconSend = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
      const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
      const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
      const IconSquare = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>;
      const IconCheckSquare = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
      const IconLoading = () => <svg className="animate-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;
      const IconGraduation = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>;

      function App() {
        const [inputText, setInputText] = useState('');
        const [result, setResult] = useState('');
        const [loading, setLoading] = useState(false);
        const [processingFile, setProcessingFile] = useState(false);
        const [fileStatus, setFileStatus] = useState('');
        const [error, setError] = useState(null);
        const [gradeLevel, setGradeLevel] = useState('middle');
        
        // 題型設定
        const [quizOptions, setQuizOptions] = useState({
          reading: true,
          trueFalse: true,
          multipleChoice: true
        });

        const fileInputRef = useRef(null);

        const toggleQuizOption = (key) => {
          setQuizOptions(prev => ({ ...prev, [key]: !prev[key] }));
        };

        const handleFileUpload = async (event) => {
          const file = event.target.files[0];
          if (!file) return;

          setProcessingFile(true);
          setFileStatus(`正在讀取 ${file.name}...`);
          setError(null);

          try {
            let extractedText = "";
            if (file.type === "application/pdf") {
              const arrayBuffer = await file.arrayBuffer();
              const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
              let fullText = "";
              for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(' ');
              }
              extractedText = fullText;
            } else if (file.name.endsWith('.docx')) {
              const arrayBuffer = await file.arrayBuffer();
              const res = await mammoth.extractRawText({ arrayBuffer });
              extractedText = res.value;
            } else if (file.type.startsWith("image/")) {
              const { data: { text } } = await Tesseract.recognize(file, 'chi_tra+eng');
              extractedText = text;
            } else {
              extractedText = await file.text();
            }

            setInputText(prev => prev ? prev + "\n\n" + extractedText : extractedText);
            setFileStatus("匯入成功！");
            setTimeout(() => setProcessingFile(false), 800);
          } catch (err) {
            setError(`檔案處理失敗：${err.message}`);
            setProcessingFile(false);
          }
        };

        const handleGenerate = () => {
          if (!inputText.trim()) { setError('請輸入教材內容'); return; }
          if (!Object.values(quizOptions).some(v => v)) { setError('請至少選擇一種題型'); return; }

          setLoading(true);
          setError(null);
          setResult('');

          const gradeConfigs = {
            'low': { name: '國小低年級 (1-2年級)', min: 100, max: 200, focus: '基礎生活禮儀、安全常識。' },
            'middle': { name: '國小中年級 (3-4年級)', min: 300, max: 450, focus: '社會互動情境、因果關係與解決問題。' },
            'high': { name: '國小高年級 (5-6年級)', min: 600, max: 800, focus: '媒體識讀、公民意識、批判思考。' }
          };

          const config = gradeConfigs[gradeLevel];
          
          const prompt = `
            【角色任務】你是一位專業的國小語文教師，擅長設計符合 108 課綱核心素養的測驗。
            
            【強制性約束：文章長度控制】
            當生成「素養閱讀題組」時，改寫後的文章總字數「絕對嚴禁」超過 ${config.max} 字。
            - 目標字數：${config.min} 至 ${config.max} 字之間。
            - 如果原文太長，請僅選取核心段落進行摘要，不要全部保留。

            【適用對象】${config.name}
            【教材背景】
            ${inputText}

            ---

            【生成需求與規範】

            1. [素養閱讀題組] (僅在使用者勾選時生成)
               - 請根據上述教材，改寫成一篇約「${config.min}-${config.max}」字的流暢文章。
               - 設計 3 個題目，檢測學生對文章內容的整合詮釋能力。
               - 須附正確答案與解析。

            2. [是非題與單選題] (僅在使用者勾選時生成)
               - **重要規定**：這兩類題目「不需要」引用上述閱讀文章的具體細節。
               - **出題核心**：請將教材中傳達的知識或核心素養概念，轉化為「日常生活實踐情境」。
               - **情境示例**：將知識點帶入生活場景（如：購物、過馬路、與人對話）。
               - **數量**：是非題與單選題各 3 題。
               - 須附正確答案與解析。

            ---

            【輸出格式要求】
            - 使用純文字，不使用 Markdown 標籤。
            - 每個章節標題前請空一行。
            - 文字難易度須嚴格符合 ${config.name} 的認知水準。

            【生成的題型清單】
            ${quizOptions.reading ? '- 生成：素養閱讀題組' : ''}
            ${quizOptions.trueFalse ? '- 生成：生活情境是非題' : ''}
            ${quizOptions.multipleChoice ? '- 生成：生活情境單選題' : ''}
          `;

          if (typeof google !== 'undefined') {
            google.script.run
              .withSuccessHandler((response) => {
                setResult(response);
                setLoading(false);
              })
              .withFailureHandler((err) => {
                setError(err.message);
                setLoading(false);
              })
              .generateQuizContent({ prompt, options: quizOptions });
          } else {
            setError('環境錯誤：此功能需在 Google Apps Script 中運行。');
            setLoading(false);
          }
        };

        const handleCopy = () => {
          navigator.clipboard.writeText(result);
          setFileStatus("已複製到剪貼簿！");
          setProcessingFile(true);
          setTimeout(() => setProcessingFile(false), 800);
        };

        return (
          <div className="min-h-screen bg-slate-50 flex flex-col relative">
            <input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
            
            {processingFile && (
              <div className="fixed inset-0 z-[60] flex items-center justify-center loading-overlay">
                <div className="bg-white p-6 rounded-xl shadow-2xl flex flex-col items-center border border-slate-200">
                  <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                  <h3 className="text-lg font-bold text-emerald-800 text-center">系統通知</h3>
                  <p className="text-slate-600 mt-2 text-sm">{fileStatus}</p>
                </div>
              </div>
            )}

            <header className="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
              <div className="container mx-auto px-4 py-4 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <IconBook />
                  <h1 className="text-xl font-bold tracking-tight">素養導向測驗生成器 <span className="text-xs font-normal bg-indigo-500/50 px-2 py-0.5 rounded ml-2">字數約束版</span></h1>
                </div>
              </div>
            </header>

            <main className="container mx-auto px-4 py-6 max-w-7xl flex-grow grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="flex flex-col gap-4">
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[350px]">
                  <div className="p-3 border-b bg-slate-50 flex justify-between items-center font-semibold text-slate-700">
                    <span className="text-sm">教材原文 (靈感來源)</span>
                    <button onClick={() => fileInputRef.current.click()} className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-100 flex items-center gap-1 transition-colors">
                      <IconUpload /> 上傳檔案
                    </button>
                  </div>
                  <textarea value={inputText} onChange={(e) => setInputText(e.target.value)} className="flex-1 p-4 resize-none outline-none text-slate-700 text-sm leading-relaxed" placeholder="請貼上內容..." />
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-5">
                  <div>
                    <h3 className="text-sm font-bold text-slate-500 mb-3 flex items-center gap-2 uppercase tracking-wider">
                      <IconGraduation className="w-4 h-4" /> 1. 學生程度設定
                    </h3>
                    <div className="grid grid-cols-3 gap-3">
                      {[
                        { id: 'low', label: '低年級', range: '100-200字' },
                        { id: 'middle', label: '中年級', range: '300-450字' },
                        { id: 'high', label: '高年級', range: '600-800字' }
                      ].map(l => (
                        <button 
                          key={l.id} 
                          onClick={() => setGradeLevel(l.id)} 
                          className={`flex flex-col items-center py-2 text-sm rounded-xl border font-bold transition-all ${gradeLevel === l.id ? 'bg-indigo-600 text-white border-indigo-600 shadow-md ring-2 ring-indigo-200' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}
                        >
                          <span>{l.label}</span>
                          <span className={`text-[10px] font-normal ${gradeLevel === l.id ? 'text-indigo-100' : 'text-slate-400'}`}>{l.range}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-slate-500 mb-3 flex items-center gap-2 uppercase tracking-wider">
                      <IconCheckSquare className="w-4 h-4" /> 2. 題型與生成模式
                    </h3>
                    <div className="space-y-2">
                      <button
                        onClick={() => toggleQuizOption('reading')}
                        className={`w-full flex items-center justify-between px-4 py-3 text-sm rounded-xl border transition-all ${quizOptions.reading ? 'bg-indigo-50 border-indigo-300 text-indigo-800' : 'bg-white text-slate-400 border-slate-200'}`}
                      >
                        <div className="flex items-center gap-3">
                          {quizOptions.reading ? <IconCheckSquare className="text-indigo-600" /> : <IconSquare />}
                          <div className="text-left">
                            <div className="font-bold">素養閱讀題組 (嚴格限字數)</div>
                            <div className="text-[10px] opacity-70">AI 將自動摘要原文，確保長度適中</div>
                          </div>
                        </div>
                      </button>

                      <div className="grid grid-cols-2 gap-2">
                        {[
                          { id: 'trueFalse', label: '是非題 (3題)', sub: '生活實踐情境' },
                          { id: 'multipleChoice', label: '單選題 (3題)', sub: '生活實踐情境' }
                        ].map(opt => (
                          <button
                            key={opt.id}
                            onClick={() => toggleQuizOption(opt.id)}
                            className={`flex flex-col items-center justify-center gap-1 p-3 text-sm rounded-xl border transition-all ${quizOptions[opt.id] ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-white text-slate-400 border-slate-200'}`}
                          >
                            <div className="flex items-center gap-2 font-bold">
                              {quizOptions[opt.id] ? <IconCheckSquare className="text-emerald-600" /> : <IconSquare />}
                              {opt.label}
                            </div>
                            <span className="text-[10px] opacity-60 font-normal">{opt.sub}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <button onClick={handleGenerate} disabled={loading || !inputText} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 disabled:bg-slate-300 transition-all shadow-lg active:scale-[0.98]">
                    {loading ? <IconLoading /> : <IconSend />} 
                    <span>{loading ? 'AI 正嚴格控管字數生成中...' : '生成生活素養測驗'}</span>
                  </button>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col min-h-[600px] overflow-hidden">
                <div className="p-3 border-b bg-slate-50 flex justify-between items-center font-semibold text-slate-700">
                  <span className="flex items-center gap-2 text-sm"><IconCheck className="text-emerald-600" /> 測驗預覽視窗</span>
                  <button onClick={handleCopy} disabled={!result} className="p-2 hover:bg-slate-200 rounded-lg text-slate-500 disabled:opacity-30"><IconCopy /></button>
                </div>
                <div className="flex-1 p-6 overflow-y-auto result-area bg-white text-sm leading-relaxed whitespace-pre-wrap selection:bg-indigo-100">
                  {error && (
                    <div className="bg-red-50 text-red-600 p-4 rounded-xl border border-red-100 flex flex-col gap-2">
                      <span className="font-bold">發生錯誤</span>
                      <span className="text-xs">{error}</span>
                    </div>
                  )}
                  {result || (loading ? (
                    <div className="flex flex-col items-center justify-center h-full space-y-6">
                      <div className="relative">
                        <div className="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                        <IconBook className="absolute inset-0 m-auto text-indigo-300 w-6 h-6" />
                      </div>
                      <div className="text-center">
                        <p className="text-slate-700 font-bold mb-1">正在進行字數調控與出題...</p>
                        <p className="text-slate-400 text-xs">請稍候，AI 正在確保內容不超長</p>
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center justify-center h-full text-slate-300 space-y-4">
                      <IconBook className="w-12 h-12" />
                      <p className="text-slate-400">尚未生成測驗內容</p>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
